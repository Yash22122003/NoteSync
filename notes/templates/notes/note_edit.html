<!DOCTYPE html>
<html>
<head>
    <title>Edit Note</title>
</head>
<body>

    <h1>Edit Note</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label>
        <br>
        <input type="text" name="title" value="{{ note.title }}">
        <br><br>

        <label>Content:</label>
        <br>
        <textarea name="content">{{ note.content }}</textarea>
        <br><br>

        <button type="submit">Update Note</button>
    </form>

    <br>

    <a href="{% url 'note_list' %}">Back to Notes</a>

</body>
</html>
