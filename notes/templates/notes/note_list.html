<!DOCTYPE html>
<html>
<head>
    <title>My Notes</title>
</head>
<body>

    <h1>My Notes</h1>
    <a href="{% url 'note_create' %}">Create New Note</a>
    <hr>
    {% for note in notes %}
        <h2>{{ note.title }}</h2>
        <p>{{ note.content }}</p>
        <a href="{% url 'note_edit' note.id %}">Edit</a>
        
        <a href="{% url 'note_delete' note.id %}">Delete</a>
        <hr>
    {% endfor %}

</body>
</html>
